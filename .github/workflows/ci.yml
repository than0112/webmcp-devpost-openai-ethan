name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and evaluation tests
        run: npm test -- --run

      - name: Build production artifacts
        run: npm run build

      - name: Test Sites worker
        run: npm run test:sites

      - name: Verify required release files
        shell: bash
        run: test -f dist/client/index.html && test -f dist/server/index.js && test -f dist/.openai/hosting.json

      - name: Upload verified production artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-lost-found-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
