name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: |
          npm run typecheck
          npm test -- --run
          npm run build
          npm run test:sites

      - name: Verify required release files
        shell: bash
        run: test -f dist/client/index.html && test -f dist/server/index.js && test -f dist/.openai/hosting.json

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: pages-release-${{ github.sha }}
          path: dist/client/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: release-gate
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production client
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/client --project-name agent-lost-found --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
